name: ci

on:
  push:
    branches: [master, release/*]
  pull_request:
    branches: [master, release/*]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: resolve msrv
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.msrv.outputs.msrv }}
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }} / ${{ matrix.rust }} / ${{ matrix.runtime }})
    needs: msrv
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ["${{ needs.msrv.outputs.version }}", beta, nightly]
        runtime: [runtime-tokio, runtime-agnostic]
        include:
          - rust: nightly
            continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace --no-default-features --features ${{ matrix.runtime }}
        continue-on-error: ${{ matrix.continue-on-error || false }}

  clippy:
    name: clippy
    needs: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.msrv.outputs.version }}
          components: clippy
      - run: cargo clippy --all-targets --features proposed -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
